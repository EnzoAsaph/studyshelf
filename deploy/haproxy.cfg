# Load balancer config on lb-01 (/etc/haproxy/haproxy.cfg, relevant part).
# HAProxy handles HTTPS and sends every request to web-01 or web-02 in turn (round robin).

frontend www-https
    bind *:443 ssl crt /etc/haproxy/certs/
    http-request set-header X-Forwarded-Proto https
    default_backend web-servers

frontend www-http
    bind *:80
    # Send all plain HTTP visitors to HTTPS
    http-request redirect scheme https code 301 unless { ssl_fc }

backend web-servers
    balance roundrobin
    server web-01 3.82.203.173:80 check
    server web-02 13.221.226.57:80 check
