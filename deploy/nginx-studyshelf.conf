# Added inside the existing "server { listen 80 default_server; ... }" block
# in /etc/nginx/sites-available/default on BOTH web-01 and web-02.
# It serves the app from /var/www/studyshelf at the URL path /studyshelf/

location /studyshelf/ {
    alias /var/www/studyshelf/;
    index index.html;
    try_files $uri $uri/ /studyshelf/index.html;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header X-Served-By $hostname;
}
